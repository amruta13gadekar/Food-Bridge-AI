<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Bridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    body {
        background-image: url("{{ url_for('static', filename='images/gallery1.jpg') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
    }

    .login-box {

    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(12px);

    border-radius: 20px;

    padding: 45px;

    width: 590px;
    min-height: 580px;

    box-shadow: 0 8px 32px rgba(0,0,0,0.3);

}


    .card {
        background: transparent;
        border: none;
    }


    .card-header {

        background: rgba(25, 135, 84, 0.7) !important;
        border-radius: 15px 15px 0 0 !important;

    }


    .card-body {

        background: rgba(255,255,255,0.25);
        border-radius: 0 0 15px 15px;

    }


    .form-control {

        background: rgba(255,255,255,0.7);
        border: none;
        border-radius: 10px;

    }


    .form-control:focus {

        background: rgba(255,255,255,0.9);
        box-shadow: none;

    }


    label {

        color: white;
        font-weight: bold;

    }


    .login-btn {

        border-radius: 10px;
        padding: 10px;

    }


    </style>

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-success">

    <div class="container">

        <a class="navbar-brand" href="/">
            🍽️ Food Bridge
        </a>


        <div class="ms-auto">

            <a href="/" class="btn btn-light me-2">
                Home
            </a>


            <a href="/register" class="btn btn-warning">
                Register
            </a>

        </div>

    </div>

</nav>



<div class="container mt-6">


    <div class="row justify-content-center">


        <div class="col-md-5">


            <div class="card login-box">


                <div class="card-header text-white text-center">

                    <h3>
                        Login
                    </h3>

                </div>



                <div class="card-body">


                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}



                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>


                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   required>

                        </div>




                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>


                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   required>

                        </div>




                        <button class="btn btn-success w-100 login-btn">

                            Login

                        </button>


                    </form>



                    <hr>


                    <p class="text-center text-white">

                        Don't have an account?

                        <a href="/register" class="text-warning fw-bold">
                            Register Here
                        </a>

                    </p>


                </div>


            </div>


        </div>


    </div>


</div>


</body>

</html>
