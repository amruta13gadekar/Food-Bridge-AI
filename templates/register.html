<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Food Bridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body {

    background-image: url("{{ url_for('static', filename='images/rice.jpg') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;

}


.register-box {

    background: rgba(255,255,255,0.20);

    border-radius: 20px;

    padding: 45px;

    width: 550px;
    min-height: 590px;

    box-shadow: 0 8px 32px rgba(0,0,0,0.3);

}


.card {

    background: transparent;
    border: none;

}


.card-header {

    background: rgba(25,135,84,0.7) !important;

    border-radius: 15px 15px 0 0 !important;

}


.card-body {
    background: rgba(255,255,255,0.15);
}


.form-control {

    background: rgba(255,255,255,0.7);

    border: none;

    border-radius: 10px;

}


label {

    color:white;

    font-weight:bold;

}


.register-btn {

    border-radius:10px;

    padding:10px;

}


</style>

</head>



<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-success">

<div class="container">

<a class="navbar-brand" href="/">
🍽️ Food Bridge
</a>


<div class="ms-auto">

<a href="/" class="btn btn-light me-2">
Home
</a>


<a href="/login" class="btn btn-warning">
Login
</a>

</div>

</div>

</nav>



<div class="container mt-5">


<div class="row justify-content-center">


<div class="col-md-6">


<div class="card register-box">


<div class="card-header text-white text-center">

<h3>
Create Account
</h3>

</div>



<div class="card-body">

    {% if success %}
    <div class="alert alert-success">
        {{ success }}
    </div>

    <script>
        setTimeout(function () {
            window.location.href = "/login";                     
        }, 2000);
    </script>
    {% endif %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <!-- Rest of your registration form -->

    </form>

</div>


<form method="POST">




<div class="mb-3">

<label>
Email
</label>

<input type="email"
name="email"
class="form-control"
required>

</div>



<div class="mb-3">

<label>
Password
</label>

<input type="password"
name="password"
class="form-control"
required>

</div>



<div class="mb-3">

<label>
Role
</label>

<select name="role" class="form-control" required>

<option value="donor">
Donor
</option>

<option value="ngo">
NGO
</option>

</select>

</div>



<button class="btn btn-success w-100 register-btn">

Register

</button>


</form>



<hr>


<p class="text-center text-white">

Already have an account?

<a href="/login" class="text-warning fw-bold">
Login Here
</a>

</p>


</div>


</div>


</div>


</div>


</div>


</body>
</html>
